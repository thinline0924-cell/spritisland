<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>(仮)アイドル育成 試作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop">
    <div id="wall"><span class="wall-logo">MITSUBA<br>PRODUCTION</span><span class="wall-asset">管理番号 MP-NB-0117</span></div>
    <div id="icons"></div>
    <div id="sticky"></div>
    <div id="windows"></div>
    <div id="toasts"></div>
  </div>

  <div id="startmenu" hidden></div>

  <footer id="taskbar">
    <button id="startbtn" class="tb-btn" title="スタート"></button>
    <form id="tb-search"><span class="i"></span><input placeholder="検索"></form>
    <div class="pins">
      <button class="tb-btn" data-pin="explorer" title="エクスプローラー"></button>
      <button class="tb-btn" data-pin="browser" title="ブラウザ"></button>
      <button class="tb-btn" data-pin="mail" id="pin-mail" title="メール"></button>
      <button class="tb-btn" data-pin="chat" id="pin-chat" title="チャット"></button>
      <button class="tb-btn" data-pin="calendar" title="カレンダー"></button>
      <button class="tb-btn" data-pin="sheet" title="表計算"></button>
    </div>
    <div id="tasks"></div>
    <div id="tray"><span class="ti" data-i="wifi"></span><span class="ti" data-i="vol"></span><span class="ti batt" data-i="battery"><small>23%</small></span><div id="clock"></div></div>
  </footer>

  <div id="lock" tabindex="0">
    <div class="lk-clock"><div class="lk-time"></div><div class="lk-date">10月26日 月曜日</div></div>
    <div class="lk-user"><div class="lk-av"></div><div>新グループ担当P</div><div class="lk-hint">クリックしてサインイン</div></div>
    <div class="lk-note">⚠ バッテリー残量が少なくなっています</div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/os.js"></script>
  <script src="js/data.js"></script>
  <script>
    // タスクバーのアイコンを埋める
    document.getElementById('startbtn').innerHTML = Icons.get('start');
    document.querySelector('#tb-search .i').innerHTML = Icons.get('search');
    document.querySelectorAll('[data-pin]').forEach(b => b.innerHTML = Icons.get({ explorer: 'folder', browser: 'browser', mail: 'mail', chat: 'chat', calendar: 'calendar', sheet: 'sheet' }[b.dataset.pin]));
    document.querySelectorAll('#tray .ti').forEach(t => t.insertAdjacentHTML('afterbegin', Icons.get(t.dataset.i)));
    document.querySelector('.lk-av').innerHTML = Icons.get('user');
  </script>
  <script src="js/group.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
